[package]
name = "philomena"
version = "0.4.0"
authors = ["Xe <https://github.com/Xe>", "Luna <https://github.com/Meow>", "Liam White <https://github.com/liamwhite>"]
edition = "2024"

[lib]
name = "philomena"
path = "src/lib.rs"
crate-type = ["dylib"]

[workspace]
members = [
    "mediaproc",
    "mediaproc_server",
]

[dependencies]
base64 = "0.23"
comrak = { git = "https://github.com/philomena-dev/comrak", branch = "philomena-0.59.0.1", default-features = false }
http = "1.5"
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }
mediaproc = { path = "./mediaproc" }
regex = "1.13"
ring = "0.17"
rustler = "0.39"
similar = { version = "3.2", features = ["inline", "unicode"] }
tokio = { version = "1.54", features = ["full"] }
url = "2.5"
zip = { version = "9.3", features = ["deflate"], default-features = false }
