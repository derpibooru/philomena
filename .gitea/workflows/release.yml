name: Release Images

# Gitea only reads .gitea/workflows when it exists, so the upstream
# .github/workflows (CI + multi-arch GHCR publishing) are ignored here.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: git.fanbooru.org
  IMAGE_PREFIX: git.fanbooru.org/derpibooru

jobs:
  build-and-push:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: philomena
            dockerfile: ./docker/production/Dockerfile
          - image: philomena-web
            dockerfile: ./docker/production/web/Dockerfile
          - image: mediaproc
            dockerfile: ./docker/mediaproc/Dockerfile
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v5

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
        with:
          # dind's bridges default to MTU 1500 but the pod network is 1370
          # (flannel over WireGuard); oversized packets get dropped and
          # downloads in RUN steps hang. Use the pod's network directly.
          driver-opts: network=host

      - name: Log in to Gitea container registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD || vars.REGISTRY_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name != 'release' }}

      - name: Build and push ${{ matrix.image }}
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
